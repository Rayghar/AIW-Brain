apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiw-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiw-api
  template:
    metadata:
      labels:
        app: aiw-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/aiw-api:0.10.0-rc.10.58.0
          ports:
            - containerPort: 4100
          readinessProbe:
            httpGet:
              path: /ready
              port: 4100
          livenessProbe:
            httpGet:
              path: /health
              port: 4100
          env:
            - name: PORT
              value: "4100"
            - name: HOST
              value: 0.0.0.0
            - name: AIW_LLM_RUNTIME_CONFIG_PATH
              value: /var/lib/aiw/config/llm-runtime-overrides.json
          envFrom:
            - secretRef:
                name: aiw-runtime-secrets
          volumeMounts:
            - name: runtime-config
              mountPath: /var/lib/aiw/config
      volumes:
        - name: runtime-config
          persistentVolumeClaim:
            claimName: aiw-runtime-config
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: aiw-api
  ports:
    - port: 4100
      targetPort: 4100
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiw-runtime-config
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiw-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiw-web
  template:
    metadata:
      labels:
        app: aiw-web
    spec:
      containers:
        - name: web
          image: ghcr.io/example/aiw-web:0.10.0-rc.10.58.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aiw-web
spec:
  selector:
    app: aiw-web
  ports:
    - port: 80
      targetPort: 80
