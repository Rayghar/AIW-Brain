name: AIW Operational Architecture Cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
jobs:
  reference-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run operational:reference
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-operational-architecture
          path: generated/operational-cycle
