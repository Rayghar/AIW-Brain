name: AIW CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aiw
          POSTGRES_USER: aiw
          POSTGRES_PASSWORD: aiw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aiw" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aiw:aiw@localhost:5432/aiw
      AIW_ALLOW_DEV_AUTH: 'true'
      AIW_DEV_TOKEN_SECRET: ci-development-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run migrate:db
      - run: npm run postgres:integration
      - run: npm run postgres:logical-backup-test
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build-release-manifest.mjs && node scripts/verify-knowledge.mjs
      - run: node scripts/verify-p0.mjs
      - run: npm run build
      - run: npm run security:check
      - run: npm run e2e
      - run: npm run architecture:gate
      - run: npm run intelligence:gate
      - run: npm run benchmark
      - run: npm run sprint7_9:verify
      - run: npm run sprint8_0:verify
      - run: npm run sprint8_0_1:verify
      - run: npm run sprint8_0_2:verify
      - run: npm run knowledge:verify:production
      - run: npm run reconciliation:gate
      - run: npm run hardening:gate

  browser-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm run browser:perf
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-browser-performance
          path: BROWSER_PERFORMANCE.json
