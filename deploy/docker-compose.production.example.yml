services:
  aiw-api:
    image: aiw/api:${AIW_VERSION:-0.10.0-rc.10.70.1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AIW_DEPLOYMENT_MODE: production
      AIW_ALLOW_DEV_AUTH: "false"
      DATABASE_URL: ${DATABASE_URL}
      AIW_JOB_QUEUE_ADAPTER: postgres
      AIW_KNOWLEDGE_OBJECT_STORE: s3
      AIW_KNOWLEDGE_S3_ENDPOINT: http://minio:9000
      AIW_KNOWLEDGE_S3_BUCKET: ${AIW_KNOWLEDGE_S3_BUCKET:-aiw-knowledge}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/minio_access_key
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_secret_key
      AIW_OIDC_ISSUER: ${AIW_OIDC_ISSUER}
      AIW_OIDC_AUDIENCE: ${AIW_OIDC_AUDIENCE}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      AIW_RELEASE_SIGNER_PROVIDER: ${AIW_RELEASE_SIGNER_PROVIDER}
    secrets: [minio_access_key, minio_secret_key]
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      otel-collector: { condition: service_started }

  aiw-worker:
    image: aiw/worker:${AIW_VERSION:-0.10.0-rc.10.70.1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      AIW_JOB_QUEUE_ADAPTER: postgres
      AIW_WORKER_HEARTBEAT_FILE: /var/run/aiw/worker-heartbeat.json
      AIW_REPOSITORY_PROVIDER: ${AIW_REPOSITORY_PROVIDER:-github}
      AIW_SCHEDULED_JOBS_JSON: ${AIW_SCHEDULED_JOBS_JSON:-[]}
      AIW_SCHEDULE_TICK_MS: ${AIW_SCHEDULE_TICK_MS:-30000}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    secrets: [github_app_private_key]
    volumes: [aiw_runtime:/var/run/aiw]
    depends_on:
      postgres: { condition: service_healthy }

  aiw-web:
    image: aiw/web:${AIW_VERSION:-0.10.0-rc.10.70.1}
    restart: unless-stopped
    ports: ["8081:80"]
    depends_on: [aiw-api]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiw
      POSTGRES_USER: aiw
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [aiw_pg_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aiw -d aiw"], interval: 5s, timeout: 5s, retries: 20 }

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    secrets: [minio_access_key, minio_secret_key]
    volumes: [aiw_object_data:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 10s, timeout: 5s, retries: 20 }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.129.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]

secrets:
  postgres_password: { file: ./secrets/postgres_password.txt }
  minio_access_key: { file: ./secrets/minio_access_key.txt }
  minio_secret_key: { file: ./secrets/minio_secret_key.txt }
  github_app_private_key: { file: ./secrets/github_app_private_key.pem }
volumes:
  aiw_pg_data:
  aiw_object_data:
  aiw_runtime:
